<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Crypto Predictions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://social-vibecoding.usernodelabs.org/usernode-bridge/v1/bridge.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center gap-6 p-4">

  <span id="staging-badge" class="hidden fixed top-3 right-3 text-xs font-semibold uppercase tracking-wide bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded">Staging</span>

  <div class="text-center">
    <h1 class="text-2xl font-bold">Crypto Predictions</h1>
    <p class="text-sm text-zinc-500 mt-1">Trade 15-minute crypto predictions with platform tokens.</p>
  </div>

  <div id="card" class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-lg">
    <div id="loading" class="text-center text-zinc-500 text-sm py-8">Loading…</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};

    // Point the bridge's post-send inclusion poller at our own same-origin
    // /explorer-api proxy (the iframe has no platform token to reach the
    // explorer directly). Relative path, no trailing slash — the bridge
    // appends its own sub-path. Guarded: the bridge installs window.usernode
    // synchronously, but never assume it's present.
    if (window.usernode) window.usernode.transactionsBaseUrl = '/explorer-api';

    const card = document.getElementById('card');
    const REGISTER_MEMO = JSON.stringify({ app: 'binier/crypto_predictions', action: 'register' });

    function shortAddr(a) {
      if (!a) return '';
      return a.length > 16 ? a.slice(0, 10) + '…' + a.slice(-6) : a;
    }

    function extractTxId(result) {
      if (!result) return null;
      if (typeof result === 'string') return result;
      const keys = ['tx_id', 'txid', 'txId', 'hash', 'tx_hash', 'txHash', 'id'];
      for (const k of keys) if (result[k] != null) return String(result[k]);
      if (result.tx) return extractTxId(result.tx);
      return null;
    }

    function renderNoWallet() {
      card.innerHTML =
        '<h2 class="text-lg font-semibold text-center mb-2">Link a wallet to register</h2>' +
        '<p class="text-sm text-zinc-400 text-center">Registration requires a linked Usernode wallet to verify your on-chain transfer. Link a wallet in Usernode, then come back.</p>';
    }

    function renderRegistered(state) {
      card.innerHTML =
        '<div class="text-center">' +
        '<div class="text-3xl mb-2">✓</div>' +
        '<h2 class="text-lg font-semibold">You\'re registered</h2>' +
        '<p class="text-sm text-zinc-500 mt-1">Welcome aboard, ' + (state.username || 'trader') + '.</p>' +
        '<div class="mt-5 bg-zinc-950 border border-zinc-800 rounded-xl p-4">' +
        '<div class="text-xs uppercase tracking-wide text-zinc-500">Balance</div>' +
        '<div class="text-3xl font-bold text-violet-300 mt-1">' + Number(state.balance).toLocaleString('en-US') + '</div>' +
        '<div class="text-xs text-zinc-500">platform tokens</div>' +
        '</div>' +
        '<div class="mt-3 text-xs text-zinc-600 font-mono">' + shortAddr(state.usernode_pubkey) + '</div>' +
        '<p class="mt-4 text-sm text-zinc-500">Trading is coming soon.</p>' +
        '</div>';
    }

    // Remembers the last tx id we saw so the Verify-only recovery path can
    // re-check the same burn without sending a second transfer.
    let lastTxHash = null;

    function renderUnregistered(state) {
      card.innerHTML =
        '<h2 class="text-lg font-semibold text-center">Register to start trading</h2>' +
        '<p class="text-sm text-zinc-400 text-center mt-2">Registering burns <span class="text-zinc-200 font-medium">1 Usernode token</span> and credits you <span class="text-zinc-200 font-medium">1,000 platform tokens</span> to trade with.</p>' +
        '<div class="mt-4 text-xs text-zinc-600 text-center font-mono">' + shortAddr(state.usernode_pubkey) + '</div>' +
        '<button id="register-btn" class="mt-5 w-full py-2.5 rounded-xl bg-violet-600 hover:bg-violet-500 active:scale-95 transition-all text-white font-semibold">Register</button>' +
        '<p id="register-status" class="mt-3 text-center text-sm text-zinc-500 min-h-[1.25rem]"></p>' +
        '<p id="register-detail" class="mt-1 text-center text-xs text-zinc-600 font-mono break-words"></p>';
      setAction('Register', () => register(state));
    }

    function render(state) {
      document.getElementById('staging-badge').classList.toggle('hidden', !state.staging);
      if (state.registered) return renderRegistered(state);
      if (!state.usernode_pubkey) return renderNoWallet();
      return renderUnregistered(state);
    }

    function setStatus(msg, isError) {
      const el = document.getElementById('register-status');
      if (el) el.innerHTML = '<span class="' + (isError ? 'text-red-400' : 'text-zinc-400') + '"></span>';
      if (el && el.firstChild) el.firstChild.textContent = msg;
    }

    // The muted secondary line carrying the raw underlying reason, so a user
    // can report exactly what went wrong. Uses textContent — never HTML.
    function setDetail(text) {
      const el = document.getElementById('register-detail');
      if (el) el.textContent = text || '';
    }

    function setBtnDisabled(disabled, label) {
      const btn = document.getElementById('register-btn');
      if (!btn) return;
      btn.disabled = disabled;
      btn.classList.toggle('opacity-50', disabled);
      btn.classList.toggle('cursor-not-allowed', disabled);
      if (label) btn.textContent = label;
    }

    // Re-enable the action button with a given label and click handler.
    function setAction(label, handler) {
      const btn = document.getElementById('register-btn');
      if (!btn) return;
      btn.disabled = false;
      btn.classList.remove('opacity-50', 'cursor-not-allowed');
      btn.textContent = label;
      btn.onclick = handler;
    }

    // Render a failure: friendly headline + muted reason line, and offer the
    // correct recovery. recovery === 'verify' shows "Verify registration"
    // (re-checks the chain, never re-sends) for cases where a transfer may
    // already be on-chain; otherwise "Register" (safe — nothing was sent).
    function showFailure(headline, detail, recovery, state) {
      setStatus(headline, true);
      setDetail(detail || '');
      if (recovery === 'verify') {
        setAction('Verify registration', () => verify(state));
      } else {
        setAction('Register', () => register(state));
      }
    }

    // POST the confirm step (shared by the Register flow's confirm phase and
    // the Verify-only recovery). Never calls sendTransaction.
    async function confirmRegistration(state, txHash) {
      let res;
      try {
        res = await fetch('/api/register/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ tx_hash: txHash }),
        });
      } catch (err) {
        console.error('[register]', 'confirm', err);
        showFailure(
          'Your transfer went through, but we couldn\'t reach the server to finish. Use "Verify registration" to retry.',
          err && err.message ? err.message : String(err),
          'verify', state);
        return;
      }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        console.error('[register]', 'confirm', res.status, body && body.error);
        showFailure(
          body.error || "We couldn't verify your registration transfer yet.",
          'HTTP ' + res.status + (body && body.error ? ' — ' + body.error : ''),
          'verify', state);
        return;
      }
      const next = await res.json();
      render(next);
    }

    async function register(state) {
      // No pre-call guard on window.usernode.sendTransaction: the bridge
      // assigns it synchronously, but a name check fires false-negatives in
      // some iframe contexts (relay handshake). The State 3 no-wallet case is
      // already gated upstream (the button only renders when usernode_pubkey
      // is present). Send and confirm are separate phases so a confirm-step
      // network error is never mislabeled as a wallet cancellation.
      setBtnDisabled(true, 'Sending…');
      setStatus('Opening your wallet…');
      setDetail('');

      // --- Send phase: burn 1 token to the burn address with the memo. ---
      // Prefer the bridge's window.usernode.sendTransaction; fall back to a
      // top-level window.sendTransaction if that's what the host exposes. No
      // pre-call guard — if neither is callable the call throws and the catch
      // below classifies it like any other send failure.
      let txHash = null;
      try {
        // Re-assert the inclusion-poll base right before sending: the relay
        // handshake can replace window.usernode after initial load.
        if (window.usernode) window.usernode.transactionsBaseUrl = '/explorer-api';
        // Invoke in place (not via a detached reference) so the bridge method
        // keeps its `this === window.usernode` receiver.
        const useBridge = window.usernode && typeof window.usernode.sendTransaction === 'function';
        const result = useBridge
          ? await window.usernode.sendTransaction(state.burnAddress, 1, REGISTER_MEMO)
          : await window.sendTransaction(state.burnAddress, 1, REGISTER_MEMO);
        txHash = extractTxId(result);
        lastTxHash = txHash;
      } catch (err) {
        console.error('[register]', 'send', err);
        const msg = (err && err.message ? err.message : String(err)).toLowerCase();
        const detail = err && err.message ? err.message : String(err);
        if (/cancel|reject|declin/.test(msg)) {
          // Genuine user cancellation — nothing was sent, safe to retry.
          showFailure('Registration cancelled — no tokens were sent. You can try again.', detail, 'register', state);
        } else if (/not available|relay timed out/.test(msg)) {
          // Wallet never reached — the transfer was never broadcast.
          showFailure('Couldn\'t reach your Usernode wallet. Make sure you opened this app inside the Usernode app, then reload and try again.', detail, 'register', state);
        } else if (/appear|waiting for transaction/.test(msg)) {
          // Inclusion timed out — the burn may already be on-chain.
          showFailure('Your transfer may have been sent. Don\'t send it again — use "Verify registration" to finish, or reload in a moment.', detail, 'verify', state);
        } else {
          // Unknown failure after the wallet was invoked — assume possibly
          // sent and offer Verify, never a fresh Register (no double-burn).
          showFailure('Your transfer may have been sent. Don\'t send it again — use "Verify registration" to finish.', detail, 'verify', state);
        }
        return;
      }

      // --- Confirm phase: backend re-verifies the transfer on-chain. ---
      setStatus('Waiting for confirmation…');
      setBtnDisabled(true, 'Confirming…');
      await confirmRegistration(state, txHash);
    }

    // Verify-only recovery: re-check the chain for an already-sent burn.
    // Reuses the last known tx id (or null) and never calls sendTransaction.
    async function verify(state) {
      setBtnDisabled(true, 'Verifying…');
      setStatus('Verifying your registration…');
      setDetail('');
      await confirmRegistration(state, lastTxHash);
    }

    async function load() {
      try {
        const res = await fetch('/api/me', { headers });
        if (!res.ok) {
          card.innerHTML = '<p class="text-center text-zinc-500 text-sm py-6">Sign in through Usernode to register.</p>';
          return;
        }
        const state = await res.json();
        render(state);
      } catch (err) {
        card.innerHTML = '<p class="text-center text-zinc-500 text-sm py-6">Couldn\'t load your status. Please reload.</p>';
      }
    }

    load();
  </script>
</body>
</html>
